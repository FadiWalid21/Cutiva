<figure
  class="frame-preview"
  [class.frame-preview--door]="kind() === 'door'"
  [class.frame-preview--hopper]="kind() === 'hopper'"
  [class.frame-preview--structure]="isStructure()"
  [class.frame-preview--solid]="isSolid()"
  [class.frame-preview--compact]="compact()"
>
  <figcaption class="frame-preview__cap">
    <strong>{{ label() }}</strong>
    @if (sectorName()) {
      <span>{{ sectorName() }}</span>
    }
  </figcaption>

  @if (hasSize()) {
    <div class="frame-preview__canvas">
      <svg
        [attr.viewBox]="'0 0 ' + geometry().viewW + ' ' + geometry().viewH"
        role="img"
        [attr.aria-label]="label()"
      >
        <defs>
          <linearGradient [attr.id]="gradientId()" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" [attr.stop-color]="finish().light" />
            <stop offset="45%" [attr.stop-color]="finish().mid" />
            <stop offset="100%" [attr.stop-color]="finish().dark" />
          </linearGradient>
          <linearGradient [attr.id]="gradientId() + '-glass'" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop
              offset="0%"
              [attr.stop-color]="glass().top"
              [attr.stop-opacity]="glassStops().topOpacity"
            />
            <stop
              offset="55%"
              [attr.stop-color]="glass().mid"
              [attr.stop-opacity]="glassStops().midOpacity"
            />
            <stop
              offset="100%"
              [attr.stop-color]="glass().bottom"
              [attr.stop-opacity]="glassStops().bottomOpacity"
            />
          </linearGradient>
          <linearGradient [attr.id]="gradientId() + '-panel'" x1="0%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" [attr.stop-color]="finish().light" stop-opacity="0.95" />
            <stop offset="100%" [attr.stop-color]="finish().dark" stop-opacity="0.95" />
          </linearGradient>
        </defs>

        @if (kind() === 'hopper') {
          <!-- Side elevation: wall, vertical frame, top-hinged sash open downward -->
          <line
            [attr.x1]="geometry().wallX"
            [attr.y1]="geometry().y - 2"
            [attr.x2]="geometry().wallX"
            [attr.y2]="geometry().y + geometry().h + 2"
            stroke="rgba(0,0,0,0.28)"
            stroke-width="2.2"
            stroke-linecap="round"
          />
          <rect
            [attr.x]="geometry().frameFrontX"
            [attr.y]="geometry().y"
            [attr.width]="geometry().frameDepth"
            [attr.height]="geometry().h"
            rx="1.5"
            [attr.fill]="'url(#' + gradientId() + ')'"
            stroke="rgba(0,0,0,0.22)"
            stroke-width="0.8"
          />
          <!-- Closed-position cue (dashed vertical) -->
          <line
            [attr.x1]="geometry().closedSashX"
            [attr.y1]="geometry().hingeY"
            [attr.x2]="geometry().closedSashX"
            [attr.y2]="geometry().hingeY + geometry().arcR"
            stroke="rgba(0,0,0,0.22)"
            stroke-width="1.1"
            stroke-dasharray="2.5 2"
          />
          <!-- Swing arc -->
          <path
            [attr.d]="
              'M ' +
              geometry().closedSashX +
              ' ' +
              (geometry().hingeY + geometry().arcR) +
              ' A ' +
              geometry().arcR +
              ' ' +
              geometry().arcR +
              ' 0 0 0 ' +
              geometry().sashTipX +
              ' ' +
              geometry().sashTipY
            "
            fill="none"
            stroke="rgba(13,148,136,0.45)"
            stroke-width="1.2"
            stroke-dasharray="3 2.5"
          />
          <polygon
            [attr.points]="geometry().hopperPoints"
            [attr.fill]="'url(#' + gradientId() + '-glass)'"
            stroke="rgba(0,0,0,0.35)"
            stroke-width="0.9"
          />
          @if (isDouble()) {
            <line
              [attr.x1]="geometry().hingeX - 1"
              [attr.y1]="geometry().hingeY + geometry().arcR * 0.28"
              [attr.x2]="geometry().sashTipX + 2"
              [attr.y2]="geometry().sashTipY - geometry().arcR * 0.12"
              stroke="rgba(255,255,255,0.55)"
              [attr.stroke-width]="geometry().iguGap"
              opacity="0.75"
            />
          }
          <!-- Hinge mark at top -->
          <circle
            [attr.cx]="geometry().hingeX"
            [attr.cy]="geometry().hingeY"
            r="2.4"
            [attr.fill]="finish().dark"
            stroke="rgba(0,0,0,0.25)"
            stroke-width="0.4"
          />
          <circle
            [attr.cx]="geometry().hingeX"
            [attr.cy]="geometry().hingeY"
            r="1"
            [attr.fill]="finish().light"
          />
        } @else if (kind() === 'window') {
          <!-- Outer aluminum frame -->
          <rect
            [attr.x]="geometry().x"
            [attr.y]="geometry().y"
            [attr.width]="geometry().w"
            [attr.height]="geometry().h"
            rx="2.5"
            [attr.fill]="'url(#' + gradientId() + ')'"
            stroke="rgba(0,0,0,0.22)"
            stroke-width="0.8"
          />
          <rect
            [attr.x]="geometry().innerX"
            [attr.y]="geometry().innerY"
            [attr.width]="geometry().innerW"
            [attr.height]="geometry().innerH"
            rx="1"
            [attr.fill]="'url(#' + gradientId() + '-glass)'"
            stroke="rgba(255,255,255,0.35)"
            [attr.stroke-width]="isStructure() ? 1.2 : 0.6"
          />
          @if (isDouble()) {
            <rect
              [attr.x]="geometry().innerX + geometry().iguGap"
              [attr.y]="geometry().innerY + geometry().iguGap"
              [attr.width]="geometry().innerW - geometry().iguGap * 2"
              [attr.height]="geometry().innerH - geometry().iguGap * 2"
              rx="0.5"
              fill="none"
              stroke="rgba(255,255,255,0.45)"
              stroke-width="0.7"
            />
          }
          <polygon
            class="frame-preview__shine"
            [attr.points]="
              geometry().innerX +
              2 +
              ',' +
              (geometry().innerY + 2) +
              ' ' +
              (geometry().innerX + geometry().innerW * 0.42) +
              ',' +
              (geometry().innerY + 2) +
              ' ' +
              (geometry().innerX + 2) +
              ',' +
              (geometry().innerY + geometry().innerH * 0.55)
            "
          />
          @if (showMullion()) {
            <rect
              [attr.x]="geometry().midX - geometry().mullionW / 2"
              [attr.y]="geometry().innerY"
              [attr.width]="geometry().mullionW"
              [attr.height]="geometry().innerH"
              [attr.fill]="'url(#' + gradientId() + ')'"
              stroke="rgba(0,0,0,0.15)"
              stroke-width="0.4"
            />
          }
        } @else {
          <!-- Outer aluminum frame (door) -->
          <rect
            [attr.x]="geometry().x"
            [attr.y]="geometry().y"
            [attr.width]="geometry().w"
            [attr.height]="geometry().h"
            rx="2.5"
            [attr.fill]="'url(#' + gradientId() + ')'"
            stroke="rgba(0,0,0,0.22)"
            stroke-width="0.8"
          />
          @if (isStructure()) {
            <rect
              [attr.x]="geometry().innerX"
              [attr.y]="geometry().innerY"
              [attr.width]="geometry().innerW"
              [attr.height]="geometry().innerH"
              rx="1"
              [attr.fill]="'url(#' + gradientId() + '-glass)'"
              stroke="rgba(0,0,0,0.28)"
              stroke-width="1.1"
            />
            <rect
              [attr.x]="geometry().innerX + 3"
              [attr.y]="geometry().innerY + 3"
              [attr.width]="geometry().innerW - 6"
              [attr.height]="geometry().innerH - 6"
              rx="0.5"
              fill="none"
              [attr.stroke]="finish().dark"
              stroke-width="1.4"
              opacity="0.35"
            />
          } @else {
            <rect
              [attr.x]="geometry().innerX"
              [attr.y]="geometry().innerY"
              [attr.width]="geometry().innerW"
              [attr.height]="geometry().innerH"
              rx="1"
              [attr.fill]="'url(#' + gradientId() + '-panel)'"
              stroke="rgba(0,0,0,0.2)"
              stroke-width="0.5"
            />
            <line
              [attr.x1]="geometry().innerX + 3"
              [attr.y1]="geometry().midY"
              [attr.x2]="geometry().innerX + geometry().innerW - 3"
              [attr.y2]="geometry().midY"
              [attr.stroke]="finish().dark"
              stroke-width="1.2"
              opacity="0.45"
            />
          }
        }

        @if (hasRoleColors() && kind() !== 'hopper') {
          <!-- Role-colored frame edges (recipes try-size only) -->
          @if (roleColor('FrameTop'); as c) {
            <rect
              [attr.x]="geometry().x"
              [attr.y]="geometry().y"
              [attr.width]="geometry().w"
              [attr.height]="geometry().frame"
              [attr.fill]="c"
              opacity="0.92"
            />
          }
          @if (roleColor('FrameBottom'); as c) {
            <rect
              [attr.x]="geometry().x"
              [attr.y]="geometry().y + geometry().h - geometry().frame"
              [attr.width]="geometry().w"
              [attr.height]="geometry().frame"
              [attr.fill]="c"
              opacity="0.92"
            />
          }
          @if (roleColor('FrameJamb'); as c) {
            <rect
              [attr.x]="geometry().x"
              [attr.y]="geometry().y + geometry().frame"
              [attr.width]="geometry().frame"
              [attr.height]="geometry().h - geometry().frame * 2"
              [attr.fill]="c"
              opacity="0.92"
            />
            <rect
              [attr.x]="geometry().x + geometry().w - geometry().frame"
              [attr.y]="geometry().y + geometry().frame"
              [attr.width]="geometry().frame"
              [attr.height]="geometry().h - geometry().frame * 2"
              [attr.fill]="c"
              opacity="0.92"
            />
          }
          <!-- Sash outline -->
          @if (roleColor('SashRail'); as c) {
            <rect
              [attr.x]="geometry().sashX"
              [attr.y]="geometry().sashY"
              [attr.width]="geometry().sashW"
              [attr.height]="geometry().sashStroke"
              [attr.fill]="c"
              opacity="0.95"
            />
            <rect
              [attr.x]="geometry().sashX"
              [attr.y]="geometry().sashY + geometry().sashH - geometry().sashStroke"
              [attr.width]="geometry().sashW"
              [attr.height]="geometry().sashStroke"
              [attr.fill]="c"
              opacity="0.95"
            />
          }
          @if (roleColor('SashStile'); as c) {
            <rect
              [attr.x]="geometry().sashX"
              [attr.y]="geometry().sashY + geometry().sashStroke"
              [attr.width]="geometry().sashStroke"
              [attr.height]="geometry().sashH - geometry().sashStroke * 2"
              [attr.fill]="c"
              opacity="0.95"
            />
            <rect
              [attr.x]="geometry().sashX + geometry().sashW - geometry().sashStroke"
              [attr.y]="geometry().sashY + geometry().sashStroke"
              [attr.width]="geometry().sashStroke"
              [attr.height]="geometry().sashH - geometry().sashStroke * 2"
              [attr.fill]="c"
              opacity="0.95"
            />
          }
          @if (showMullion() && roleColor('InterlockStile'); as c) {
            <rect
              [attr.x]="geometry().midX - geometry().mullionW / 2"
              [attr.y]="geometry().innerY"
              [attr.width]="geometry().mullionW"
              [attr.height]="geometry().innerH"
              [attr.fill]="c"
              opacity="0.9"
            />
          }
        }

        <!-- Handles drawn last so role-color overlays never hide them -->
        @if (kind() === 'hopper') {
          <g
            [attr.transform]="
              'translate(' + geometry().hopHandleX + ',' + geometry().hopHandleY + ')'
            "
          >
            <circle
              [attr.r]="geometry().hopHandleR"
              [attr.fill]="finish().dark"
              stroke="rgba(0,0,0,0.25)"
              stroke-width="0.4"
            />
            <rect
              [attr.x]="-geometry().hopLeverW"
              [attr.y]="-geometry().hopLeverH / 2"
              [attr.width]="geometry().hopLeverW"
              [attr.height]="geometry().hopLeverH"
              [attr.rx]="geometry().hopLeverH * 0.45"
              [attr.fill]="finish().light"
              stroke="rgba(0,0,0,0.3)"
              stroke-width="0.35"
            />
          </g>
        } @else if (kind() === 'window') {
          <g
            [attr.transform]="
              'translate(' + geometry().handleX + ',' + geometry().handleY + ')'
            "
          >
            <rect
              [attr.x]="-geometry().winBaseW / 2"
              [attr.y]="-geometry().winBaseH / 2"
              [attr.width]="geometry().winBaseW"
              [attr.height]="geometry().winBaseH"
              [attr.rx]="geometry().winBaseW * 0.28"
              [attr.fill]="finish().dark"
              opacity="0.92"
            />
            <rect
              [attr.x]="geometry().winLeverX"
              [attr.y]="-geometry().winLeverH / 2"
              [attr.width]="geometry().winLeverW"
              [attr.height]="geometry().winLeverH"
              [attr.rx]="geometry().winLeverH * 0.45"
              [attr.fill]="finish().light"
              stroke="rgba(0,0,0,0.28)"
              stroke-width="0.35"
            />
          </g>
        } @else {
          <g
            [attr.transform]="
              'translate(' + geometry().handleX + ',' + geometry().handleY + ')'
            "
          >
            <circle
              [attr.r]="geometry().doorKnobR"
              [attr.fill]="finish().dark"
              stroke="rgba(0,0,0,0.2)"
              stroke-width="0.35"
            />
            <rect
              [attr.x]="geometry().doorLeverX"
              [attr.y]="-geometry().doorLeverH / 2"
              [attr.width]="geometry().doorLeverW"
              [attr.height]="geometry().doorLeverH"
              [attr.rx]="geometry().doorLeverH * 0.48"
              [attr.fill]="finish().light"
              stroke="rgba(0,0,0,0.3)"
              stroke-width="0.35"
            />
          </g>
        }

        <text
          class="frame-preview__dim"
          [attr.x]="geometry().widthLabelX"
          [attr.y]="geometry().widthLabelY"
          text-anchor="middle"
        >
          {{ formatCm(widthMm()!) }} {{ 'common.cm' | translate }}
        </text>

        <text
          class="frame-preview__dim"
          [attr.x]="geometry().heightLabelX"
          [attr.y]="geometry().heightLabelY"
          text-anchor="middle"
          [attr.transform]="
            'rotate(-90 ' +
            geometry().heightLabelX +
            ' ' +
            geometry().heightLabelY +
            ')'
          "
        >
          {{ formatCm(heightMm()!) }} {{ 'common.cm' | translate }}
        </text>
      </svg>
      @if (qty() > 1) {
        <span class="frame-preview__qty">×{{ qty() }}</span>
      }
    </div>
  } @else {
    <p class="frame-preview__empty">{{ 'preview.noSize' | translate }}</p>
  }
</figure>
